name: Pilot enquiry
description: Ask about a US$500 design-partner member-pack pilot for your community
title: "Pilot enquiry: "
labels: ["pilot-enquiry"]
body:
  - type: markdown
    attributes:
      value: |
        Scope and terms: https://docs-site-x4mi.vercel.app/#pilot. Fit questions: https://docs-site-x4mi.vercel.app/#fit.

        **This issue is public: anyone can read it.** Only give information that is already public on your community's page.
        Don't post member numbers, renewal rates, revenue, lesson files or contact details. We reply here within 2 business
        days and agree a private channel for those.
  - type: input
    id: community
    attributes:
      label: Community link
    validations:
      required: true
  - type: input
    id: price
    attributes:
      label: Monthly membership price (as shown on your public page)
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: First outcome you promise new members (as described on your public page)
    validations:
      required: true
  - type: dropdown
    id: lessons
    attributes:
      label: Do your lessons exist as text or transcripts?
      options: ["Yes", "Partly", "No, video only", "Not sure"]
    validations:
      required: true
  - type: dropdown
    id: tools
    attributes:
      label: Which AI tool do most of your members use?
      options: ["Claude", "A mix of Claude and ChatGPT", "ChatGPT", "Not sure"]
    validations:
      required: true
  - type: checkboxes
    id: public
    attributes:
      label: Public issue
      options:
        - label: I understand this issue is public and I haven't posted private numbers, files or contact details.
          required: true
